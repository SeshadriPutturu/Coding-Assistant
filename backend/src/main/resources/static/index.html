<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programming Assistant</title>
  <style>
    :root { color-scheme: dark; --bg: #111110; --sidebar: #191918; --surface: #20201e; --surface-soft: #292926; --line: #383834; --text: #f2f0e9; --muted: #a7a59d; --accent: #d7a45e; --accent-soft: #f0c381; --danger: #ef9b91; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: var(--bg); font-family: Georgia, 'Times New Roman', serif; }
    button, textarea { font: inherit; }
    button { color: inherit; border: 0; cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { display: flex; width: 278px; flex: 0 0 278px; flex-direction: column; padding: 18px 12px; background: var(--sidebar); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 9px 22px; font: 700 13px/1.2 Consolas, monospace; letter-spacing: .4px; }
    .brand-mark { display: grid; width: 27px; height: 27px; place-items: center; color: #181714; border-radius: 8px; background: var(--accent); font: 700 15px Georgia, serif; }
    .new-chat { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; color: var(--text); border: 1px solid var(--line); border-radius: 7px; background: transparent; text-align: left; font: 13px Consolas, monospace; }
    .new-chat:hover, .nav-button:hover { background: var(--surface-soft); }
    .plus { color: var(--accent-soft); font-size: 20px; line-height: 12px; }
    .section-label { margin: 26px 10px 9px; color: #77766f; font: 700 10px Consolas, monospace; letter-spacing: 1.3px; text-transform: uppercase; }
    .recent-list { display: flex; flex: 1; flex-direction: column; gap: 3px; overflow-y: auto; }
    .recent-item { display: flex; align-items: center; width: 100%; min-height: 38px; padding: 9px 10px; overflow: hidden; color: var(--muted); border-radius: 6px; background: transparent; text-align: left; font: 12px/1.35 Consolas, monospace; white-space: nowrap; text-overflow: ellipsis; }
    .recent-item:hover, .recent-item.active { color: var(--text); background: var(--surface-soft); }
    .empty-recent { padding: 8px 10px; color: #716f68; font: 11px/1.5 Consolas, monospace; }
    .sidebar-footer { padding: 12px 9px 0; color: #77766f; border-top: 1px solid var(--line); font: 10px Consolas, monospace; }
    .workspace { display: flex; min-width: 0; flex: 1; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 34px; border-bottom: 1px solid var(--line); }
    .model-name { color: var(--muted); font: 12px Consolas, monospace; }
    .model-name strong { color: var(--text); font-weight: 400; }
    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font: 11px Consolas, monospace; }
    .status::before { width: 7px; height: 7px; border-radius: 50%; content: ''; background: #79b798; box-shadow: 0 0 10px rgba(121, 183, 152, .6); }
    .status.thinking::before { background: var(--accent); box-shadow: 0 0 10px rgba(215, 164, 94, .7); }
    .content { display: flex; min-height: 0; flex: 1; flex-direction: column; }
    #messages { display: flex; width: min(820px, calc(100% - 48px)); flex: 1; flex-direction: column; gap: 28px; margin: 0 auto; overflow-y: auto; padding: 54px 0 30px; }
    .welcome { display: grid; min-height: 48vh; place-content: center; gap: 12px; text-align: center; }
    .welcome-mark { margin: 0 auto 5px; color: var(--accent-soft); font-size: 29px; }
    .welcome h1 { margin: 0; font-size: clamp(27px, 4vw, 42px); font-weight: 500; letter-spacing: 0; }
    .welcome p { margin: 0; color: var(--muted); font: 13px Consolas, monospace; }
    .message { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 15px; line-height: 1.65; animation: appear .25s ease-out; }
    .avatar { display: grid; width: 29px; height: 29px; place-items: center; border-radius: 7px; font: 700 11px Consolas, monospace; }
    .message.user .avatar { color: #211e18; background: var(--accent); }
    .message.assistant .avatar { color: var(--text); border: 1px solid #53635b; background: #29332f; }
    .message-body { min-width: 0; padding-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
    .message.user .message-body { color: #ddd9d0; }
    .message.assistant .message-body { color: var(--text); }
    .message.error .message-body { color: var(--danger); }
    .composer-wrap { width: min(820px, calc(100% - 48px)); margin: 0 auto; padding: 12px 0 24px; }
    .composer { display: flex; align-items: end; gap: 10px; padding: 10px 10px 10px 16px; border: 1px solid #4a4943; border-radius: 12px; background: var(--surface); box-shadow: 0 8px 30px rgba(0, 0, 0, .2); }
    .composer:focus-within { border-color: #77705f; box-shadow: 0 0 0 3px rgba(215, 164, 94, .08); }
    textarea { width: 100%; min-height: 25px; max-height: 180px; resize: none; color: var(--text); border: 0; outline: 0; background: transparent; font: 15px/1.45 Georgia, 'Times New Roman', serif; }
    textarea::placeholder { color: #85837b; }
    .send { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; color: #211e18; border-radius: 8px; background: var(--accent); font: 700 16px Consolas, monospace; }
    .send:hover { background: var(--accent-soft); }
    .send:disabled { cursor: wait; opacity: .45; }
    .hint { margin: 9px 0 0; color: #706e67; text-align: center; font: 10px Consolas, monospace; }
    .mobile-menu { display: none; padding: 7px 9px; color: var(--muted); border-radius: 5px; background: transparent; font: 18px Consolas, monospace; }
    .mobile-menu:hover { background: var(--surface-soft); }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 700px) {
      .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 4; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 16px 0 45px rgba(0, 0, 0, .35); }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: block; }
      .topbar { height: 56px; padding: 0 14px; }
      #messages, .composer-wrap { width: calc(100% - 28px); }
      #messages { gap: 22px; padding-top: 30px; }
      .message { grid-template-columns: 28px minmax(0, 1fr); gap: 11px; }
      .avatar { width: 26px; height: 26px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">P</span><span>Programming Assistant</span></div>
      <button class="new-chat" id="new-chat" type="button"><span class="plus">+</span> New chat</button>
      <div class="section-label">Recent chats</div>
      <nav class="recent-list" id="recent-list" aria-label="Recent chats"></nav>
      <div class="sidebar-footer">Local workspace companion</div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Open chat history">=</button>
        <div class="model-name"><strong>Assistant</strong> / local session</div>
        <div class="status" id="status">Ready</div>
      </header>
      <div class="content">
        <section id="messages" aria-live="polite"></section>
        <div class="composer-wrap">
          <form class="composer" id="chat-form">
            <textarea id="message" aria-label="Message" placeholder="Message your assistant..." rows="1" required></textarea>
            <button class="send" id="send" type="submit" aria-label="Send message">^</button>
          </form>
          <p class="hint">Local AI can make mistakes. Check important code before using it.</p>
        </div>
      </div>
    </main>
  </div>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const send = document.getElementById('send');
    const messages = document.getElementById('messages');
    const status = document.getElementById('status');
    const recentList = document.getElementById('recent-list');
    const sidebar = document.getElementById('sidebar');
    const chatsKey = 'programming-assistant-chats';
    let conversationId;
    let chats = loadChats();

    function loadChats() {
      try { return JSON.parse(localStorage.getItem(chatsKey) || '[]'); } catch { return []; }
    }

    function saveChats() { localStorage.setItem(chatsKey, JSON.stringify(chats.slice(0, 20))); }

    function renderRecent() {
      recentList.replaceChildren();
      if (!chats.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-recent';
        empty.textContent = 'Your conversations will appear here.';
        recentList.appendChild(empty);
        return;
      }
      chats.forEach((chat) => {
        const item = document.createElement('button');
        item.className = `recent-item${chat.id === conversationId ? ' active' : ''}`;
        item.type = 'button';
        item.textContent = chat.title;
        item.addEventListener('click', () => openChat(chat.id));
        recentList.appendChild(item);
      });
    }

    function showWelcome() {
      messages.replaceChildren();
      const welcome = document.createElement('div');
      welcome.className = 'welcome';
      welcome.innerHTML = '<div class="welcome-mark">*</div><h1>How can I help you today?</h1><p>Ask about code, architecture, debugging, or your next idea.</p>';
      messages.appendChild(welcome);
    }

    function addMessage(text, kind) {
      document.querySelector('.welcome')?.remove();
      const item = document.createElement('article');
      item.className = `message ${kind}`;
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = kind === 'user' ? 'YOU' : 'PA';
      const body = document.createElement('div');
      body.className = 'message-body';
      body.textContent = text;
      item.append(avatar, body);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function openChat(id) {
      const chat = chats.find((entry) => entry.id === id);
      if (!chat) return;
      conversationId = chat.id;
      messages.replaceChildren();
      chat.messages.forEach((entry) => addMessage(entry.text, entry.kind));
      renderRecent();
      sidebar.classList.remove('open');
      input.focus();
    }

    function newChat() {
      conversationId = undefined;
      showWelcome();
      renderRecent();
      sidebar.classList.remove('open');
      input.focus();
    }

    function rememberMessage(text, kind) {
      let chat = chats.find((entry) => entry.id === conversationId);
      if (!chat) {
        chat = { id: conversationId, title: text.slice(0, 42) || 'New conversation', messages: [], updatedAt: Date.now() };
        chats.unshift(chat);
      }
      chat.messages.push({ text, kind });
      chat.updatedAt = Date.now();
      chats.sort((a, b) => b.updatedAt - a.updatedAt);
      saveChats();
      renderRecent();
    }

    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 180)}px`; });
    input.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
    document.getElementById('new-chat').addEventListener('click', newChat);
    document.getElementById('mobile-menu').addEventListener('click', () => sidebar.classList.toggle('open'));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;
      addMessage(message, 'user');
      input.value = '';
      input.style.height = 'auto';
      send.disabled = true;
      status.classList.add('thinking');
      status.textContent = 'Thinking';
      try {
        const response = await fetch('/api/v1/assistant/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, conversationId }) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || `Request failed (${response.status})`);
        conversationId = data.conversationId;
        rememberMessage(message, 'user');
        addMessage(data.answer || 'The assistant returned no answer.', 'assistant');
        rememberMessage(data.answer || 'The assistant returned no answer.', 'assistant');
        status.classList.remove('thinking');
        status.textContent = 'Ready';
      } catch (error) {
        const reason = error.message || 'Could not reach the assistant.';
        addMessage(reason, 'error');
        status.classList.remove('thinking');
        status.textContent = 'Connection issue';
      } finally { send.disabled = false; input.focus(); }
    });

    renderRecent();
    showWelcome();
  </script>
</body>
</html>
