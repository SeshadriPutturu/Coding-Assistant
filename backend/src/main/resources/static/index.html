<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programming Assistant</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #edf4f2;
      --muted: #99aaa8;
      --panel: rgba(18, 31, 35, 0.9);
      --line: rgba(181, 211, 204, 0.16);
      --accent: #e3a35d;
      --accent-strong: #f1bd79;
      --user: #224a4d;
      --assistant: #18282d;
      --danger: #ff9f9f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #0c171b;
      font-family: Georgia, 'Times New Roman', serif;
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: '';
      opacity: .42;
      background-image: linear-gradient(rgba(144, 189, 176, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(144, 189, 176, .06) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }
    .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 32px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent-strong); font: 700 11px/1.2 Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 64px); line-height: .95; font-weight: 500; letter-spacing: 0; }
    .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font: 12px Consolas, monospace; white-space: nowrap; }
    .status::before { width: 8px; height: 8px; border-radius: 50%; content: ''; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 24px 70px rgba(0, 0, 0, .24); backdrop-filter: blur(12px); }
    #messages { display: flex; flex-direction: column; gap: 14px; min-height: 380px; max-height: 56vh; overflow-y: auto; padding: 24px; }
    .empty { margin: auto; color: var(--muted); font-size: 18px; text-align: center; }
    .message { max-width: 82%; padding: 13px 16px; border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; line-height: 1.5; }
    .message.user { align-self: end; border-color: rgba(227, 163, 93, .35); background: var(--user); }
    .message.assistant { align-self: start; background: var(--assistant); }
    .message.error { align-self: start; color: var(--danger); border-color: rgba(255, 159, 159, .35); }
    form { display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--line); background: rgba(10, 20, 23, .7); }
    textarea { flex: 1; min-height: 54px; max-height: 160px; resize: vertical; padding: 13px; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; outline: none; background: #101f23; font: 15px/1.4 Georgia, 'Times New Roman', serif; }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(227, 163, 93, .12); }
    button { align-self: stretch; min-width: 112px; padding: 0 18px; color: #172125; border: 0; border-radius: 5px; background: var(--accent); font: 700 13px Consolas, monospace; cursor: pointer; }
    button:hover { background: var(--accent-strong); }
    button:disabled { cursor: wait; opacity: .55; }
    @media (max-width: 600px) {
      .shell { width: min(100% - 20px, 960px); padding-top: 24px; }
      header { align-items: start; flex-direction: column; gap: 14px; }
      #messages { min-height: 48vh; padding: 16px; }
      .message { max-width: 94%; }
      form { flex-direction: column; }
      button { min-height: 46px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">Local development companion</p><h1>Programming<br>Assistant</h1></div>
      <div class="status" id="status">Ready</div>
    </header>
    <section class="panel" aria-label="Assistant chat">
      <div id="messages" aria-live="polite"><div class="empty" id="empty">Ask a question about your code.</div></div>
      <form id="chat-form">
        <textarea id="message" aria-label="Message" placeholder="Ask the assistant..." required></textarea>
        <button id="send" type="submit">SEND</button>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const send = document.getElementById('send');
    const messages = document.getElementById('messages');
    const status = document.getElementById('status');
    let conversationId;

    function addMessage(text, kind) {
      document.getElementById('empty')?.remove();
      const item = document.createElement('div');
      item.className = `message ${kind}`;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;
      addMessage(message, 'user');
      input.value = '';
      send.disabled = true;
      status.textContent = 'Thinking';
      try {
        const response = await fetch('/api/v1/assistant/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, conversationId })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || `Request failed (${response.status})`);
        conversationId = data.conversationId;
        addMessage(data.answer || 'The assistant returned no answer.', 'assistant');
        status.textContent = 'Ready';
      } catch (error) {
        addMessage(error.message || 'Could not reach the assistant.', 'error');
        status.textContent = 'Connection issue';
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
