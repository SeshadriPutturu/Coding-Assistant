spring:
  application:
    name: programming-assistant-backend
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:1.5b}
          temperature: ${OLLAMA_TEMPERATURE:0.15}
          num-predict: ${OLLAMA_NUM_PREDICT:192}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  error:
    include-message: always